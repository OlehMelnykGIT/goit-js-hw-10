<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown timer</title>
    <script type="module" crossorigin src="/goit-js-hw-10/1-timer.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/vendor-BbbuE1sJ.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/vendor-CZjNVMTf.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/styles-BWTTwggX.css">
  </head>

  <body>
    <main class="page-content">
      <a class="back-link" href="./index.html">Go back</a>
      <section class="task-section">
        <h1>Countdown timer</h1>
        <div class="timer-controls">
          <input type="text" id="datetime-picker" />
          <button type="button" data-start disabled>Start</button>
        </div>
        <div class="timer">
          <div class="field">
            <span class="value" data-days>00</span><span class="label">Days</span>
          </div>
          <div class="field">
            <span class="value" data-hours>00</span><span class="label">Hours</span>
          </div>
          <div class="field">
            <span class="value" data-minutes>00</span><span class="label">Minutes</span>
          </div>
          <div class="field">
            <span class="value" data-seconds>00</span><span class="label">Seconds</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
